<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>SafeNav Scooter</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body class="bg-light">
    <div class="container mt-3">
        <div class="row">
            <div class="col-md-8"><div id="mapa-contenedor" style="height: 60vh; border-radius: 8px;"></div></div>
            <div class="col-md-4">
                <div class="card p-3">
                    <h5>Reportar Incidente</h5>
                    <input type="text" id="input-coord" class="form-control mb-2" placeholder="Coord: lat,lng">
                    <button id="btn-buscar" class="btn btn-secondary w-100 mb-2">Buscar en Mapa</button>
                    <select id="tipo-incidente" class="form-select mb-2">
                        <option value="Hurto">Hurto</option>
                        <option value="Incidente de hurto">Incidente de hurto</option>
                        <option value="Zona Oscura">Zona Oscura</option>
                        <option value="Infraestructura en mal estado">Infraestructura en mal estado</option>
                    </select>
                    <select id="gravedad-incidente" class="form-select mb-2">
                        <option value="Alta">Alta</option>
                        <option value="Media">Media</option>
                        <option value="Baja">Baja</option>
                        <option value="Precaucion">Precaucion</option>
                    </select>
                    <button id="btn-reportar" class="btn btn-danger w-100">Reportar Riesgo</button>
                </div>
                <ul id="lista-alertas" class="list-group mt-3"></ul>
            </div>
        </div>
    </div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
    <script src="js/api_handler.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
